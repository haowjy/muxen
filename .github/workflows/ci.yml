name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-release-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report release label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          labels="$(jq -r '.[] | select(startswith("release:"))' <<<"${LABELS_JSON}")"
          if [[ -n "${labels}" ]]; then
            echo "::notice::Release label(s): ${labels//$'\n'/, }"
          else
            echo "::warning::No release:* label set. Merging to main will publish a prerelease (RC); add release:skip to publish nothing."
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@ee868d7805ade43a1b47dd054727ab76c9108b4f # 1.94.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: ./.github/actions/web-toolchain

      - name: Shared preflight
        run: scripts/preflight.sh full

  real-tmux:
    name: Real tmux integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@ee868d7805ade43a1b47dd054727ab76c9108b4f # 1.94.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - uses: ./.github/actions/web-toolchain

      - name: Real tmux suites
        run: MUXEN_TMUX_TESTS=1 cargo test --test tmux_real --test hub_real -- --test-threads=1

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: ./.github/actions/web-toolchain

      - name: Check
        # Explicitly bypass rust-toolchain.toml to exercise the crate's MSRV.
        run: cargo +1.85 check --locked --all-targets
