name: Muxen
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  MuxenKit:
    path: MuxenKit
schemes:
  Muxen:
    build:
      targets:
        Muxen: all
    run:
      config: Debug
targets:
  Muxen:
    type: application
    platform: iOS
    sources:
      - path: Muxen
    dependencies:
      - package: MuxenKit
    info:
      path: build/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.jimmyyao.muxen
            CFBundleURLSchemes:
              - muxen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.muxen
        PRODUCT_NAME: muxen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock muxen to connect to your servers."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to upload it to a tmux session."
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    postBuildScripts:
      - name: Build bundled web UI
        script: |
          "${PROJECT_DIR}/scripts/build-web.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/WebUI/index.html
